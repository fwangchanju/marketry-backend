plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.6.0'
	id 'net.ltgt.errorprone' version '5.1.0'
	id 'org.openrewrite.rewrite' version '7.34.0'
}

group = 'kr.co'
version = '0.0.1-SNAPSHOT'
description = 'marketry'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// spring
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-json'
	// Hibernate JSONB 매퍼는 Jackson 2를 사용하므로 거래 세션의 java.time 변환 모듈이 필요하다.
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.springframework.retry:spring-retry:2.0.12'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// test
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// postgresql
	implementation 'org.postgresql:postgresql'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// caffeine
	implementation 'com.github.ben-manes.caffeine:caffeine'

	// ok http, krx data market login
	implementation 'com.squareup.okhttp3:okhttp:4.12.0'
	implementation 'com.squareup.okhttp3:okhttp-urlconnection:4.12.0'

	// querydsl
	implementation 'io.github.openfeign.querydsl:querydsl-core:7.3.0'
	implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.3.0'
	annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.3.0:jpa'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

	// 코드 품질 (error prone, openrewrite)
	errorprone 'com.google.errorprone:error_prone_core:2.49.0'
	rewrite(platform('org.openrewrite.recipe:rewrite-recipe-bom:3.32.0'))
	rewrite('org.openrewrite.recipe:rewrite-migrate-java')
	rewrite('org.openrewrite.recipe:rewrite-static-analysis')
}

tasks.named('test') {
	systemProperty 'java.awt.headless', 'true'
	// 실제 외부 API 호출/텔레그램 발송이 필요한 매뉴얼 테스트는 CI/일반 test에서 제외한다 — manualTest로 따로 돌린다.
	useJUnitPlatform {
		excludeTags 'manual'
	}
}

tasks.register('manualTest', Test) {
	group = 'verification'
	description = '실제 외부 API 호출/텔레그램 발송이 필요한 매뉴얼 테스트만 실행한다. 예: ./gradlew manualTest --tests "*.FullDataCollectionTest" -i'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'manual'
	}
}

tasks.register('marketCalendarTest', Test) {
	group = 'verification'
	description = '월 또는 날짜 범위의 실제 토스 시간표를 로컬 DB에 적재한다. 예: ./gradlew.bat marketCalendarTest -PcalendarMonth=202601'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'manual'
	}
	filter {
		includeTestsMatching '*MarketCalendarManualTest'
	}
	def requestedCalendarMonth = providers.systemProperty('calendar.month')
			.orElse(providers.gradleProperty('calendarMonth'))
	if (requestedCalendarMonth.isPresent()) {
		systemProperty 'calendar.month', requestedCalendarMonth.get()
	}
	def requestedCalendarDate = providers.systemProperty('calendar.date')
			.orElse(providers.gradleProperty('calendarDate'))
	if (requestedCalendarDate.isPresent()) {
		systemProperty 'calendar.date', requestedCalendarDate.get()
	}
	def requestedCalendarEndDate = providers.systemProperty('calendar.end-date')
			.orElse(providers.gradleProperty('calendarEndDate'))
	if (requestedCalendarEndDate.isPresent()) {
		systemProperty 'calendar.end-date', requestedCalendarEndDate.get()
	}
	outputs.upToDateWhen { false }
	outputs.cacheIf { false }
	testLogging {
		events 'passed', 'failed'
		showStandardStreams = true
	}
}

tasks.register('snapshotQueryTest', Test) {
	group = 'verification'
	description = 'API 호출 없이 localhost:15439의 전용 PostgreSQL에서 스냅샷 QueryDSL을 검증한다.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'manual' }
	filter { includeTestsMatching '*SectorPriceSnapshotRepositoryManualTest' }
	outputs.upToDateWhen { false }
	outputs.cacheIf { false }
}

tasks.register('kiwoomProxyTest', Test) {
	group = 'verification'
	description = '이관 전 키움 프록시 인증과 읽기 전용 조회만 확인한다. 프로세스에 인증·프록시 설정을 주입해야 한다.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'manual'
	}
	filter {
		includeTestsMatching '*KiwoomProxyManualTest'
	}
	// 환경값과 외부 연결 상태를 매번 검사한다. 과거 실행 결과로 대신하지 않는다.
	outputs.upToDateWhen { false }
	outputs.cacheIf { false }
	testLogging {
		events 'passed', 'failed'
		showStandardStreams = true
	}
}

tasks.register('kiwoomProxyCheckJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
	group = 'verification'
	description = '사용자가 맥미니에서 실행할 독립 키움 프록시 검사 프로그램을 만든다.'
	dependsOn tasks.named('testClasses')
	mainClass = 'kr.co.marketry.domain.stock.client.KiwoomProxyCheck'
	targetJavaVersion = JavaVersion.VERSION_21
	includeTools = false
	archiveFileName = 'kiwoom-proxy-check.jar'
	classpath = sourceSets.test.runtimeClasspath
}

rewrite {
	activeRecipe('org.openrewrite.java.migrate.UpgradeToJava21')
	activeRecipe('org.openrewrite.staticanalysis.CommonStaticAnalysis')
	// rewrite.yml 로 custom style 정의, import 와일드카드 병합 차단
	activeStyle('kr.co.NoWildcardImports')
}

spotless {
	java {
		target 'src/**/*.java'
		palantirJavaFormat()
	}
}

tasks.named('compileTestJava') {
	// 테스트 코드는 검사 대상에서 제외
	options.errorprone.enabled = false
}

tasks.named('compileJava') {
	// 경고를 빌드 실패로 승격 — 경고가 다시 쌓이지 않게 CI가 잡는다
	options.compilerArgs << '-Werror'
}
