name: Migrate GHCR image names

on:
  workflow_dispatch:

concurrency:
  group: release-deploy
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Log in to GHCR with workflow token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Copy missing pointers and preserve manifests
        run: |
          set -o pipefail
          bash infra/scripts/migrate-image-names.sh | tee "$RUNNER_TEMP/image-migration-result"
          cat "$RUNNER_TEMP/image-migration-result" >> "$GITHUB_STEP_SUMMARY"
