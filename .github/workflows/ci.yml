name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select infrastructure regression checks
        id: regression
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            status=0
            bash infra/regression-checks/relevant-paths.sh < "$RUNNER_TEMP/changed-paths" || status=$?
            case "$status" in
              0) echo 'enabled=true' >> "$GITHUB_OUTPUT" ;;
              1) echo 'enabled=false' >> "$GITHUB_OUTPUT" ;;
              *) exit "$status" ;;
            esac
          fi

      - name: Infrastructure regression checks (no production access)
        if: steps.regression.outputs.enabled == 'true'
        run: |
          /bin/bash infra/regression-checks/gate-regression-check.sh
          /bin/bash infra/regression-checks/macmini-release-regression-check.sh
          /bin/bash infra/regression-checks/restore-snapshot-regression-check.sh
          /bin/bash infra/regression-checks/image-names-regression-check.sh
          /bin/bash infra/regression-checks/paths-regression-check.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # DB·외부 API 없이 돌아야 한다 — 매뉴얼 테스트(@Tag("manual"))는 build.gradle의 test 태스크에서
      # 이미 제외된다(1B-1).
      - name: spotlessCheck / compileJava / compileTestJava / test
        run: ./gradlew spotlessCheck compileJava compileTestJava test

  migration-guard:
    name: Migration guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 검사 로직을 스크립트 파일이 아니라 워크플로 안에 둔다. .github/scripts/는 PR에서 고쳐 검사를
      # 무력화할 수 있지만 워크플로 파일은 Workflows 권한 없이는 고칠 수 없다.
      - name: Check destructive migrations
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          files="$(git diff --name-only --diff-filter=AMR "${base}...HEAD" -- src/main/resources/flyway/ | grep -E '\.sql$' || true)"
          if [ -z "$files" ]; then
            echo "검사 대상 마이그레이션 SQL이 없습니다."
            exit 0
          fi
          failed=0
          while IFS= read -r file; do
            # SQL 주석(-- 줄 주석, /* */ 블록 주석)을 지우되 줄 번호가 밀리지 않게 개행은 남긴다.
            stripped="$(perl -0777 -pe 's{/\*.*?\*/}{ my $c = $&; $c =~ s/[^\n]//g; $c }gse; s/--[^\n]*//g' "$file")"
            line_numbers="$(printf '%s\n' "$stripped" | grep -Eino '\b(DROP|TRUNCATE|DELETE)\b' | cut -d: -f1 | sort -un || true)"
            for line_number in $line_numbers; do
              echo "${file}:${line_number}:$(sed -n "${line_number}p" "$file")"
              failed=1
            done
          done <<<"$files"
          if [ "$failed" -ne 0 ]; then
            echo "파괴적 변경(DROP, TRUNCATE, DELETE)은 PR이 아니라 소유자가 DB에서 직접 한다."
            exit 1
          fi
          echo "파괴적 마이그레이션 SQL이 없습니다."
