name: Release

on:
  push:
    branches:
      - '**'
  repository_dispatch:
    types: [frontend-assets-published]
  workflow_dispatch:
    inputs:
      target:
        description: '수동 배포 대상. "Use workflow from"은 항상 main. application/all은 :main 이미지를, rollback은 :previous 이미지를 그대로 배포한다(이미지를 빌드하지 않음 — 대상 태그가 없으면 실패한다).'
        required: true
        default: 'application'
        type: choice
        options:
          - application
          - nginx
          - renderer
          - all
          - rollback
          - connection-check
          - diagnostics
      server:
        description: '일반 앱 배포 서버. 기본값 macmini. DB는 유지하며 oracle 선택도 DB 복원을 실행하지 않는다.'
        required: true
        default: macmini
        type: choice
        options:
          - macmini
          - oracle

# 수동·프론트 배포는 공통 큐를 사용한다. push 빌드·승격은 별도 실행한다.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && 'release-deploy' || format('release-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  route:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      server: ${{ steps.route.outputs.server }}
      target: ${{ steps.route.outputs.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment route
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          REQUESTED_SERVER: ${{ inputs.server }}
          REQUESTED_TARGET: ${{ inputs.target }}
        run: bash infra/scripts/macmini-release.sh route

  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    outputs:
      application: ${{ steps.filter.outputs.application }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            application:
              - 'Dockerfile'
              - 'src/main/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradle/**'
              - 'lombok.config'
              - '.github/workflows/release.yml'

  # 브랜치(main 제외) push: application 관련 변경이 있으면 빌드해서 sha 태그로만 푸시(승격의 재료). 배포는 안 함.
  build:
    needs: [changes]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref != 'refs/heads/main' &&
      needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "sha_tag=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/fwangchanju/marketry-application:${{ steps.tag.outputs.sha_tag }}
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application

  # main push(항상 머지 커밋): 재빌드 없이, 머지된 브랜치(HEAD^2)용으로 이미 빌드된 이미지를 :main으로
  # 승격시킨다. 배포는 하지 않는다(병합과 배포는 분리 — docs/decisions.md) — 실제 배포는 사용자가
  # Release 워크플로를 원하는 시점에 수동으로 실행한다.
  promote-main:
    needs: [changes]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve merged branch commit
        id: resolve
        run: |
          MERGED_SHA=$(git rev-parse HEAD^2 2>/dev/null || echo "")
          echo "merged_sha=$MERGED_SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.resolve.outputs.merged_sha != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check image exists for merged commit (build job이 아직 안 끝났으면 완료까지 대기)
        if: steps.resolve.outputs.merged_sha != ''
        id: check
        run: |
          TIMEOUT=600
          INTERVAL=10
          elapsed=0
          while [ "$elapsed" -lt "$TIMEOUT" ]; do
            if docker manifest inspect "ghcr.io/fwangchanju/marketry-application:sha-${{ steps.resolve.outputs.merged_sha }}" > /dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep "$INTERVAL"
            elapsed=$((elapsed + INTERVAL))
          done
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "::error::sha-${{ steps.resolve.outputs.merged_sha }} 이미지를 찾을 수 없습니다(커밋 ${{ steps.resolve.outputs.merged_sha }}). 그 커밋에 대한 build job이 돌지 않았을 가능성이 있습니다(예: application 경로 필터에 걸리지 않는 변경만 있었던 커밋)."
          exit 1

      - name: Promote image to :main (재빌드 없이 레지스트리에서 재태깅)
        if: steps.check.outputs.exists == 'true'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/fwangchanju/marketry-application:main \
            ghcr.io/fwangchanju/marketry-application:sha-${{ steps.resolve.outputs.merged_sha }}

      - name: Clean up old GHCR package versions (태그 20개 유지, main/deployed/previous 보호, 고아 매니페스트 삭제)
        if: steps.check.outputs.exists == 'true'
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: marketry-application
          keep-n-tagged: 20
          exclude-tags: main,deployed,previous
          delete-untagged: true
          token: ${{ secrets.CR_PAT }}

  # 수동 배포 (target=application/all: :main 배포, target=rollback: :previous 배포).
  # "Use workflow from"은 항상 main — 이 job은 이미지를 빌드하지 않고 이미 있는 태그를 그대로
  # 배포한다. 배포 대상 태그가 없으면 명확한 메시지와 함께 실패한다.
  # 배포(rollback 제외) 성공 시 :deployed/:previous 포인터를 갱신하고, 헬스체크 실패 시 :deployed로
  # 자동 원복한다. rollback은 :deployed ↔ :previous를 맞바꾸고, rollback 자체의 헬스체크 실패는
  # 원복하지 않고 그냥 실패시킨다(docs/decisions.md "롤백은 포인터 태그 방식으로 한다" 참고).
  application:
    needs: [route]
    if: needs.route.outputs.server == 'oracle' && github.event_name == 'workflow_dispatch' && (inputs.target == 'application' || inputs.target == 'all' || inputs.target == 'rollback')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          if [ "${{ inputs.target }}" = "rollback" ]; then
            echo "image_tag=previous" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify target image exists
        run: |
          TAG="${{ steps.tag.outputs.image_tag }}"
          if ! docker manifest inspect "ghcr.io/fwangchanju/marketry-application:${TAG}" > /dev/null 2>&1; then
            if [ "${{ inputs.target }}" = "rollback" ]; then
              echo "::error:::previous 이미지가 없습니다. 아직 두 번째 프로덕션 배포 전이라 롤백을 쓸 수 없습니다."
            else
              echo "::error:::main 이미지가 없습니다. main에 병합된 PR이 있어야 배포할 수 있습니다(이 job은 더 이상 이미지를 빌드하지 않습니다)."
            fi
            exit 1
          fi

      - name: Check if :deployed exists
        id: deployed_check
        run: |
          if docker manifest inspect "ghcr.io/fwangchanju/marketry-application:deployed" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to server 1 (application)
        uses: appleboy/ssh-action@v1
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          GIT_REF: main
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: CR_PAT,IMAGE_TAG,GIT_REF
          script: |
            source ~/repo/market-monitor-backend/infra/scripts/env.sh
            git -C "$REPO_DIR" fetch origin "$GIT_REF"
            git -C "$REPO_DIR" reset --hard "origin/$GIT_REF"
            bash "$REPO_DIR/infra/scripts/deploy-application.sh"

      - name: Health check
        id: healthcheck
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            bash "$HOME/repo/market-monitor-backend/infra/scripts/health-check.sh"

      # 평소 배포 성공 — 포인터를 민다. 먼저 다이제스트를 변수에 고정한 뒤 그 다이제스트를 소스로
      # 태그를 민다(:deployed/:previous를 순서대로 덮어쓰면 둘이 같은 이미지를 가리키게 됨).
      - name: Update deploy pointers
        if: steps.healthcheck.outcome == 'success' && inputs.target != 'rollback'
        run: |
          NEW_DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' ghcr.io/fwangchanju/marketry-application:main)
          if [ "${{ steps.deployed_check.outputs.exists }}" = "true" ]; then
            OLD_DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' ghcr.io/fwangchanju/marketry-application:deployed)
            if [ "$OLD_DIGEST" = "$NEW_DIGEST" ]; then
              echo "방금 배포한 이미지가 기존 :deployed와 동일한 다이제스트입니다. 포인터를 건드리지 않습니다."
            else
              docker buildx imagetools create -t ghcr.io/fwangchanju/marketry-application:previous "ghcr.io/fwangchanju/marketry-application@${OLD_DIGEST}"
              docker buildx imagetools create -t ghcr.io/fwangchanju/marketry-application:deployed "ghcr.io/fwangchanju/marketry-application@${NEW_DIGEST}"
            fi
          else
            docker buildx imagetools create -t ghcr.io/fwangchanju/marketry-application:deployed "ghcr.io/fwangchanju/marketry-application@${NEW_DIGEST}"
          fi

      # 롤백 성공 — :deployed ↔ :previous를 맞바꾼다. 둘 다 먼저 다이제스트를 고정한 뒤 민다.
      - name: Swap deploy pointers (rollback)
        if: steps.healthcheck.outcome == 'success' && inputs.target == 'rollback'
        run: |
          DEPLOYED_DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' ghcr.io/fwangchanju/marketry-application:deployed)
          PREVIOUS_DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' ghcr.io/fwangchanju/marketry-application:previous)
          docker buildx imagetools create -t ghcr.io/fwangchanju/marketry-application:previous "ghcr.io/fwangchanju/marketry-application@${DEPLOYED_DIGEST}"
          docker buildx imagetools create -t ghcr.io/fwangchanju/marketry-application:deployed "ghcr.io/fwangchanju/marketry-application@${PREVIOUS_DIGEST}"

      # 평소 배포의 헬스체크 실패 — :deployed로 자동 원복한다(포인터는 건드리지 않는다). 배포 스크립트가
      # 헬스체크 전에 컨테이너를 이미 교체하므로, 원복 없이 두면 서버는 새 이미지인데 :deployed는 옛
      # 이미지를 가리키는 불일치가 생겨 다음 롤백이 두 단계 전으로 가버린다.
      - name: Revert to :deployed (health check failed)
        if: steps.healthcheck.outcome == 'failure' && inputs.target != 'rollback' && steps.deployed_check.outputs.exists == 'true'
        uses: appleboy/ssh-action@v1
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          IMAGE_TAG: deployed
          GIT_REF: main
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: CR_PAT,IMAGE_TAG,GIT_REF
          script: |
            source ~/repo/market-monitor-backend/infra/scripts/env.sh
            git -C "$REPO_DIR" fetch origin "$GIT_REF"
            git -C "$REPO_DIR" reset --hard "origin/$GIT_REF"
            bash "$REPO_DIR/infra/scripts/deploy-application.sh"

      - name: Health check after revert
        if: steps.healthcheck.outcome == 'failure' && inputs.target != 'rollback' && steps.deployed_check.outputs.exists == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            bash "$HOME/repo/market-monitor-backend/infra/scripts/health-check.sh"

      - name: No :deployed to revert to
        if: steps.healthcheck.outcome == 'failure' && inputs.target != 'rollback' && steps.deployed_check.outputs.exists == 'false'
        run: echo "::warning::헬스체크가 실패했지만 :deployed 이미지가 없어(최초 배포) 원상복구를 건너뜁니다."

      # 롤백의 헬스체크 실패는 원복하지 않는다 — 돌아갈 곳이 없다.
      - name: Fail job (health check failed)
        if: steps.healthcheck.outcome == 'failure'
        run: |
          echo "::error::배포한 이미지의 헬스체크가 실패했습니다."
          exit 1

  nginx:
    needs: [route]
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'nginx' || inputs.target == 'all')) ||
      github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/nginx/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/fwangchanju/marketry-nginx:latest
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: Deploy to server 1 (nginx)
        if: needs.route.outputs.server == 'oracle'
        uses: appleboy/ssh-action@v1
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          IMAGE_TAG: latest
          GIT_REF: main
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: CR_PAT,IMAGE_TAG,GIT_REF
          script: |
            source ~/repo/market-monitor-backend/infra/scripts/env.sh
            git -C "$REPO_DIR" fetch origin "$GIT_REF"
            git -C "$REPO_DIR" reset --hard "origin/$GIT_REF"
            bash "$REPO_DIR/infra/scripts/deploy-nginx.sh"

      - name: Health check
        if: needs.route.outputs.server == 'oracle'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            bash "$HOME/repo/market-monitor-backend/infra/scripts/nginx-health-check.sh"

  renderer:
    needs: [route]
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'renderer' || inputs.target == 'all')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push renderer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/renderer/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/fwangchanju/marketry-renderer:latest
          cache-from: type=gha,scope=renderer
          cache-to: type=gha,mode=max,scope=renderer

      - name: Deploy to server 2 (renderer)
        if: needs.route.outputs.server == 'oracle'
        uses: appleboy/ssh-action@v1
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
          IMAGE_TAG: latest
          GIT_REF: main
        with:
          host: ${{ secrets.RENDERER_SERVER_HOST }}
          username: ${{ secrets.RENDERER_SERVER_USER }}
          key: ${{ secrets.RENDERER_SERVER_SSH_KEY }}
          envs: CR_PAT,IMAGE_TAG,GIT_REF
          script: |
            source ~/repo/market-monitor-backend/infra/scripts/env.sh
            git -C "$REPO_DIR" fetch origin "$GIT_REF"
            git -C "$REPO_DIR" reset --hard "origin/$GIT_REF"
            bash "$REPO_DIR/infra/scripts/deploy-renderer.sh"

      - name: Health check
        if: needs.route.outputs.server == 'oracle'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.RENDERER_SERVER_HOST }}
          username: ${{ secrets.RENDERER_SERVER_USER }}
          key: ${{ secrets.RENDERER_SERVER_SSH_KEY }}
          script: |
            bash "$HOME/repo/market-monitor-backend/infra/scripts/renderer-health-check.sh"

  macmini:
    needs: [route, nginx, renderer]
    if: |
      always() && !cancelled() &&
      needs.route.result == 'success' && needs.route.outputs.server == 'macmini' &&
      (needs.nginx.result == 'success' || needs.nginx.result == 'skipped') &&
      (needs.renderer.result == 'success' || needs.renderer.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      TARGET: ${{ needs.route.outputs.target }}
      MACMINI_HOST: ${{ secrets.MACMINI_SERVER_HOST }}
      MACMINI_USER: ${{ secrets.MACMINI_SERVER_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Connect Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Prepare SSH identity
        env:
          MACMINI_SSH_KEY: ${{ secrets.MACMINI_SERVER_SSH_KEY }}
        run: bash infra/scripts/macmini-release.sh ssh-setup

      - name: Verify installed gate protocol before deployment
        if: env.TARGET != 'connection-check'
        run: bash infra/scripts/macmini-release.sh verify-gate

      - name: Read-only production diagnostics
        if: env.TARGET == 'diagnostics'
        run: bash infra/scripts/macmini-release.sh diagnostics

      - name: Check connection without deployment
        if: env.TARGET == 'connection-check'
        run: bash infra/scripts/macmini-release.sh connection-check

      - name: Log in to GHCR
        if: env.TARGET != 'connection-check' && env.TARGET != 'diagnostics'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: env.TARGET != 'connection-check' && env.TARGET != 'diagnostics'
        uses: docker/setup-buildx-action@v3

      - name: Freeze deployment and recovery images
        if: env.TARGET != 'connection-check' && env.TARGET != 'diagnostics'
        id: images
        run: bash infra/scripts/macmini-release.sh prepare-images

      # 게이트가 자체 헬스 검사에서 실패해도 다음 원복 단계가 실행되게 한다.
      - name: Deploy through gate
        if: env.TARGET != 'connection-check' && env.TARGET != 'diagnostics'
        id: deploy
        continue-on-error: true
        env:
          IMAGE_TAG: ${{ steps.images.outputs.image_tag }}
        run: bash infra/scripts/macmini-release.sh deploy

      - name: Update deploy pointers
        if: steps.deploy.outcome == 'success'
        env:
          NEW_DIGEST: ${{ steps.images.outputs.new_digest }}
          OLD_DIGEST: ${{ steps.images.outputs.old_digest }}
        run: bash infra/scripts/macmini-release.sh update-pointers

      - name: Revert application after gate failure
        if: |
          !cancelled() && steps.deploy.outcome == 'failure' &&
          (env.TARGET == 'application' || env.TARGET == 'all') &&
          steps.images.outputs.revert_tag != ''
        id: revert
        continue-on-error: true
        env:
          TARGET: application
          IMAGE_TAG: ${{ steps.images.outputs.revert_tag }}
        run: bash infra/scripts/macmini-release.sh deploy

      - name: Report failed deployment
        if: "!cancelled() && steps.deploy.outcome == 'failure'"
        env:
          REVERT_OUTCOME: ${{ steps.revert.outcome }}
        run: |
          if [ "$REVERT_OUTCOME" = success ]; then
            echo '::error::배포 실패 후 기존 deployed 앱으로 원복했습니다. 포인터는 유지했습니다.'
          elif [ "$REVERT_OUTCOME" = failure ]; then
            echo '::error::배포와 기존 deployed 앱 원복이 모두 실패했습니다. 운영 상태 확인이 필요합니다.'
          else
            echo '::error::배포에 실패했습니다. 단독 서비스·rollback 또는 최초 앱 배포는 자동 원복하지 않습니다.'
          fi
          exit 1

      - name: Remove SSH identity
        if: always()
        run: bash infra/scripts/macmini-release.sh ssh-cleanup
