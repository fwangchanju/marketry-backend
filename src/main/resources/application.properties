spring.application.name=marketry

spring.datasource.url=jdbc:postgresql://localhost:5433/market_monitor_db
spring.datasource.username=market_monitor
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

kiwoom.app-key=${KIWOOM_APP_KEY_B}
kiwoom.secret=${KIWOOM_SECRET_B}
# 키움 호출만 거치는 HTTP 프록시. 비어 있으면 직접 연결한다(오라클·로컬 개발).
kiwoom.proxy-host=${MARKETRY_PROXY_HOST:}
kiwoom.proxy-port=${MARKETRY_PROXY_PORT:8888}

toss.client-id=${TOSS_CLIENT_ID:}
toss.client-secret=${TOSS_CLIENT_SECRET:}

auth.google.client-id=${GOOGLE_CLIENT_ID:}
auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
auth.jwt-secret=${AUTH_JWT_SECRET:}
auth.frontend-url=${AUTH_FRONTEND_URL:http://localhost:5173}
# 로컬 프론트엔드 개발 전용 로그인(DevLoginController) 활성화 여부. 이 파일은 사실상 로컬 설정(위
# datasource.url이 localhost:5433)이라 true로 고정한다. prod는 application-prod.properties에서 false로
# 덮어쓰고, @Profile("!prod")로도 컨트롤러 빈 자체가 생성되지 않아 이중으로 막힌다.
auth.dev-login.enabled=true

# 텔레그램 캡처를 렌더러에 소유자 인증 토큰과 함께 보낼지 여부. 소유자 데이터 이관 전에는 false로
# 두어 예전과 동일하게(토큰 없이) 동작한다. 이관 완료 후에만 true로 켠다.
renderer.owner-capture-enabled=${RENDERER_OWNER_CAPTURE_ENABLED:false}

krx.login-id=${KRX_ID}
krx.login-pw=${KRX_PW}
marketry.base-url=http://localhost:8081
# 소유자 계정 ID. 텔레그램 캡션 TOP2 랭킹 등 비로그인 컨텍스트의 커스텀 데이터 조회와 렌더러 캡처
# 토큰 발급이 이 계정을 기준으로 한다. 999999는 소유자 데이터 이관 전 임시 소유자다.
marketry.owner-user-id=${OWNER_USER_ID:999999}
marketry.published-user-id=${PUBLISHED_USER_ID:900000}
telegram.bot-token=${TELEGRAM_BOT_TOKEN}
telegram.chat-id=${TELEGRAM_CHAT_ID}
telegram.developer-chat-id=${DEVELOPER_CHAT_ID}
telegram.send-minute=5
telegram.send-interval-minutes=30
telegram.before-minutes=15
telegram.average-mode=WEIGHTED
telegram.sector-filter=true
telegram.map-send-times=08:15,09:15,15:30

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

krx.enabled=false

# ── 스케줄(cron 표현식에서 ${...}로 참조. collect.start-hour/end-hour는 CollectionScheduler가
# @Value로도 읽는다) ──
collect.start-hour=8
collect.end-hour=20
collect.interval-minutes=5

# 거래소 시간표 경계 — 종가 윈도우 [close-window-start, after-hours-start)의 마지막 스냅샷이 그날 종가 기준가다.
# 15:30 KRX 정규장 마감, 15:40 NXT 애프터마켓 개장. 그 10분은 두 거래소가 다 닫혀 가격이 변하지 않는다.
# 시각 하나(예: 15:35)를 박는 프로퍼티는 만들지 않는다 — 15:35 스냅샷이 없는 날 기준가를 못 구한다.
market.close-window-start=15:30
market.after-hours-start=15:40

server.port=8081
server.forward-headers-strategy=framework

# @Scheduled 기본 풀이 1스레드라 하나가 막히면 나머지 스케줄 작업까지 전부 멈춘다
spring.task.scheduling.pool.size=3
