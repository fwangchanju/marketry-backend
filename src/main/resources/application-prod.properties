# DevLoginController는 @Profile("!prod")로 이미 차단되지만, 프로퍼티 기준으로도 명시적으로 끈다(이중 가드).
auth.dev-login.enabled=false

renderer.url=${RENDERER_URL:http://market-monitor-renderer:3000}
renderer.owner-capture-enabled=true

marketry.base-url=https://marketry.co.kr
marketry.owner-user-id=1
auth.frontend-url=${marketry.base-url}

# 로컬은 키움 인증값 없이도 뜨도록 기본 파일에 빈 기본값을 두고, 운영은 값이 없으면 기동 단계에서 실패해야 해서 기본값 없이 다시 선언한다.
kiwoom.app-key=${KIWOOM_APP_KEY}
kiwoom.secret=${KIWOOM_APP_SECRET}

spring.datasource.url=${DB_URL:jdbc:postgresql://market-monitor-postgres:5432/market_monitor_db}
spring.datasource.password=${POSTGRES_PASSWORD}
