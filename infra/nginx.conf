limit_req_zone  $binary_remote_addr  zone=general:10m  rate=20r/s;
limit_req_zone  $binary_remote_addr  zone=auth:10m     rate=10r/m;
limit_conn_zone $binary_remote_addr  zone=conn:10m;

limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    server_name eolmae.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name eolmae.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/eolmae.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eolmae.duckdns.org/privkey.pem;

    return 301 https://marketry.co.kr$request_uri;
}

server {
    listen 80;
    server_name marketry.co.kr;

    # cloudflared가 붙어 있는 Docker 네트워크 대역. proxy 네트워크의 서브넷이 어느 사설 대역이든 맞도록 셋 다 둔다
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    location /api/auth/ {
        limit_req  zone=auth burst=20 nodelay;
        limit_conn conn 100;
        proxy_pass http://market-monitor:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req  zone=general burst=50 nodelay;
        limit_conn conn 100;
        proxy_pass http://market-monitor:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_req  zone=general burst=50 nodelay;
        limit_conn conn 100;
        root /usr/share/nginx/html;
        index index.html;
        # 시장별 검색 페이지는 확장자 없는 주소에 대응하는 HTML을 먼저 제공한다.
        try_files $uri $uri.html $uri/ /index.html;
    }
}
