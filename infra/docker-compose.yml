services:
  market-monitor-postgres:
    image: postgres:17-alpine
    container_name: market-monitor-postgres
    restart: always
    env_file:
      - ${HOME}/env/market-monitor.env
    environment:
      - POSTGRES_DB=market_monitor_db
      - POSTGRES_USER=market_monitor
    volumes:
      - ${DB_DATA_DIR}:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - proxy

  market-monitor:
    image: ghcr.io/fwangchanju/marketry-application:${IMAGE_TAG}
    container_name: market-monitor
    restart: always
    user: "${DEPLOY_UID}:${DEPLOY_GID}"
    env_file:
      - ${HOME}/env/market-monitor.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8081
      - TZ=Asia/Seoul
    volumes:
      - ${LOG_DIR}:/app/logs
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - proxy

networks:
  proxy:
    external: true
