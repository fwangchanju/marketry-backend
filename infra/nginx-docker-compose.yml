services:
  market-monitor-nginx:
    image: ghcr.io/fwangchanju/marketry-nginx:${IMAGE_TAG}
    container_name: market-monitor-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ${HOME}/certbot-webroot:/var/www/certbot:ro
    networks:
      - proxy

  market-monitor-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: market-monitor-cloudflared
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN이 env 파일에 없습니다}
    networks:
      - proxy

networks:
  proxy:
    external: true
