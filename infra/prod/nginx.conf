limit_req_zone  $binary_remote_addr  zone=general:10m  rate=20r/s;
limit_req_zone  $binary_remote_addr  zone=auth:10m     rate=10r/m;
limit_conn_zone $binary_remote_addr  zone=conn:10m;

limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    server_name marketry.co.kr;

    # cloudflared가 붙는 marketry-network 대역(setup-network.sh가 고정한 서브넷)
    set_real_ip_from 172.30.0.0/24;
    real_ip_header CF-Connecting-IP;

    # 렌더러의 내부 http 요청도 이 블록으로 들어오지만 앱은 https로 인식해야 하므로 X-Forwarded-Proto는 https로 고정한다
    # Actions 진단은 nginx 내부에서만 호출한다. 공개 터널에서는 접근할 수 없다.
    location = /internal/upstream-health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://marketry-application:8081/actuator/health;
    }

    location /api/auth/ {
        limit_req  zone=auth burst=20 nodelay;
        limit_conn conn 100;
        proxy_pass http://marketry-application:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req  zone=general burst=50 nodelay;
        limit_conn conn 100;
        proxy_pass http://marketry-application:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_req  zone=general burst=50 nodelay;
        limit_conn conn 100;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
