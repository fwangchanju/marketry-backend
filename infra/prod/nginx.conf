limit_req_zone  $binary_remote_addr  zone=general:10m  rate=20r/s;
limit_req_zone  $binary_remote_addr  zone=auth:10m     rate=10r/m;

# 응답 압축 — 지도 데이터(JSON)가 한 번에 약 660KB이고 홈 화면 한 번에 여러 개를 받는다. 앱은 압축하지 않고 여기서 한 번에 압축해서
# 맥미니에서 Cloudflare로 나가는 업로드를 줄인다. 이미 압축된 이미지·폰트와 1KB 미만 응답은 압축하지 않는다.
gzip            on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied    any;
gzip_vary       on;
gzip_types      application/json application/javascript text/javascript text/css text/plain image/svg+xml;
limit_conn_zone $binary_remote_addr  zone=conn:10m;

limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    server_name marketry.co.kr;

    # cloudflared가 붙는 marketry-network 대역(setup-network.sh가 고정한 서브넷)
    set_real_ip_from 172.30.0.0/24;
    real_ip_header CF-Connecting-IP;

    # 렌더러의 내부 http 요청도 이 블록으로 들어오지만 앱은 https로 인식해야 하므로 X-Forwarded-Proto는 https로 고정한다
    # Actions 진단은 nginx 내부에서만 호출한다. 공개 터널에서는 접근할 수 없다.
    location = /internal/upstream-health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://marketry-application:8081/actuator/health;
    }

    location /api/auth/ {
        limit_req  zone=auth burst=20 nodelay;
        limit_conn conn 100;
        proxy_pass http://marketry-application:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req  zone=general burst=50 nodelay;
        limit_conn conn 100;
        proxy_pass http://marketry-application:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 파일명에 해시가 붙는 빌드 산출물은 내용이 바뀌면 이름도 바뀌므로 오래 저장해도 된다.
    # 없는 파일은 index.html로 넘기지 않는다(오류 응답이 오래 저장되는 것을 막는다).
    location /assets/ {
        limit_req  zone=general burst=50 nodelay;
        limit_conn conn 100;
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 글꼴은 이름이 고정이라 해시가 없다. 바꿀 때는 파일 이름을 새로 지어 올린다.
    location /fonts/ {
        limit_req  zone=general burst=50 nodelay;
        limit_conn conn 100;
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 화면 진입점은 매번 서버에 새 버전이 있는지 확인하게 한다. 배포가 바로 반영된다.
    location / {
        limit_req  zone=general burst=50 nodelay;
        limit_conn conn 100;
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
        # 시장별 검색 페이지는 확장자 없는 주소에 대응하는 HTML을 먼저 제공한다.
        try_files $uri $uri.html $uri/ /index.html;
    }
}
